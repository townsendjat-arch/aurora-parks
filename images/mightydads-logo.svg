<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 300" width="1020" height="300">
  <rect width="1020" height="300" fill="white"/>

  <!-- MIGHTY DADS bold text -->
  <text x="8" y="285"
        font-family="'Arial Black','Impact','Franklin Gothic Heavy','sans-serif'"
        font-weight="900"
        font-size="230"
        fill="black"
        letter-spacing="-4">MIGHTY DADS</text>

  <!-- ── Silhouettes above the HT gap ── -->

  <!-- Child (left, shorter) -->
  <!-- Head -->
  <ellipse cx="400" cy="48" rx="18" ry="20" fill="black"/>
  <!-- Neck -->
  <rect x="394" y="66" width="12" height="8" fill="black"/>
  <!-- Torso -->
  <path d="M382,74 Q386,72 400,72 Q414,72 418,74 L414,128 L386,128 Z" fill="black"/>
  <!-- Left arm (down) -->
  <path d="M382,82 Q370,100 364,118" stroke="black" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- Right arm (toward dad, raised) -->
  <path d="M418,82 Q428,95 442,108" stroke="black" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- Left leg -->
  <path d="M386,128 L380,128 L372,178 L388,178 L392,145 Z" fill="black"/>
  <!-- Right leg -->
  <path d="M414,128 L420,128 L426,178 L410,178 L408,145 Z" fill="black"/>

  <!-- Father (right, taller) -->
  <!-- Head -->
  <ellipse cx="476" cy="26" rx="22" ry="24" fill="black"/>
  <!-- Neck -->
  <rect x="468" y="48" width="16" height="10" fill="black"/>
  <!-- Torso (slight V shape - broad shoulders) -->
  <path d="M452,58 Q458,55 476,55 Q494,55 500,58 L496,125 L456,125 Z" fill="black"/>
  <!-- Left arm (toward child) -->
  <path d="M452,72 Q444,90 442,108" stroke="black" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- Right arm -->
  <path d="M500,72 Q514,90 520,112" stroke="black" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- Left leg -->
  <path d="M456,125 L448,125 L440,185 L460,185 L462,150 Z" fill="black"/>
  <!-- Right leg -->
  <path d="M496,125 L504,125 L510,185 L490,185 L490,150 Z" fill="black"/>

  <!-- Joined hands (small filled circle at meeting point) -->
  <circle cx="442" cy="108" r="7" fill="black"/>
</svg>
